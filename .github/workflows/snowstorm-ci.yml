name: Snowstorm CI

on:
  push:
    branches:
      - 'features/ako/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  Snowstorm-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and run Maven tests
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/features/ako/update_snowstorm_10.12.2'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin

      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/features/ako/update_snowstorm_10.12.2'
        run: docker build -t ehealthplatformstandards/snowstorm:migration_10.12.2 .

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/features/ako/update_snowstorm_10.12.2'
        run: docker push ehealthplatformstandards/snowstorm:migration_10.12.2
