name: Snowstorm CI

on:
  push:
    branches:
      - 'features/ako/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  Snowstorm-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and run Maven tests
        run: mvn --batch-mode --no-transfer-progress clean test
